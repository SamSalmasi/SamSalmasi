<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sam Salmasi — AI x Web3 Builder</title>
  <desc id="desc">A futuristic dark digital network with neon mint and violet nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b13"/>
      <stop offset="0.55" stop-color="#10172a"/>
      <stop offset="1" stop-color="#090d15"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42f5a1" stop-opacity=".65"/>
      <stop offset="1" stop-color="#9d70ff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset=".65" stop-color="#42f5a1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9fb4d0" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <g fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".8">
    <path d="M690 0L760 72L700 132L810 190L760 268L870 360"/>
    <path d="M830 0L890 68L1010 52L1080 130L1180 100"/>
    <path d="M720 360L830 300L920 320L1000 240L1130 260L1200 220"/>
    <path d="M900 68L920 150L810 190L930 220L1000 240"/>
    <path d="M1010 52L1040 0M1080 130L1160 170L1200 150"/>
    <path d="M760 72L900 68L1010 52M930 220L920 320"/>
  </g>
  <g fill="#42f5a1" filter="url(#glow)">
    <circle cx="760" cy="72" r="3"/><circle cx="700" cy="132" r="3"/>
    <circle cx="810" cy="190" r="4"/><circle cx="870" cy="360" r="3"/>
    <circle cx="1010" cy="52" r="4"/><circle cx="1080" cy="130" r="3"/>
    <circle cx="1000" cy="240" r="4"/><circle cx="920" cy="320" r="3"/>
  </g>
  <g fill="#a78bfa" filter="url(#glow)">
    <circle cx="900" cy="68" r="3"/><circle cx="930" cy="220" r="3"/>
    <circle cx="1130" cy="260" r="3"/><circle cx="1160" cy="170" r="3"/>
  </g>
  <g font-family="monospace">
    <text x="72" y="78" font-size="15" fill="#42f5a1" letter-spacing="4">SAM.SALMASI // DIGITAL FRONTIER</text>
    <text x="68" y="160" font-size="58" font-weight="700" fill="url(#headline)">AI × WEB3</text>
    <text x="72" y="204" font-size="25" font-weight="600" fill="#e6edf3">BUILDER / DEVELOPER / EXPLORER</text>
    <text x="72" y="254" font-size="17" fill="#9aa9bd">Intelligent systems. Decentralized tools.</text>
    <text x="72" y="281" font-size="17" fill="#9aa9bd">Ideas into code — one experiment at a time.</text>
    <path d="M72 309H330" stroke="#42f5a1" stroke-width="2"/>
    <text x="72" y="336" font-size="12" fill="#42f5a1" letter-spacing="3">LESS HYPE. MORE BUILDING.</text>
  </g>
  <g transform="translate(1040 300)" opacity=".9">
    <rect x="0" y="0" width="104" height="24" rx="4" fill="#111a26" stroke="#42f5a1" stroke-opacity=".6"/>
    <circle cx="13" cy="12" r="3" fill="#42f5a1"/>
    <text x="24" y="16" font-family="monospace" font-size="10" fill="#d7e3ef">SYS_READY</text>
  </g>
</svg>
